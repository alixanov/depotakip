<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-label="Sadiya Kargo"
>
  <title>Sadiya Kargo</title>
  <!--
    Maskable PWA icon — full-bleed background, mark scaled to fit the 80%
    safe-zone so platforms with circular / squircle masks don't clip the S
    curve or the Seljuk star.
  -->
  <defs>
    <linearGradient id="msk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="msk-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#msk-bg)" />

  <g transform="translate(96 96) scale(0.625)">
    <path
      d="M 416 160
         C 416 64, 96 64, 96 192
         C 96 256, 416 256, 416 320
         C 416 448, 96 448, 96 352"
      stroke="#FFFFFF"
      stroke-width="48"
      stroke-linecap="round"
      fill="none"
    />
    <g transform="translate(256 256)">
      <rect x="-52" y="-52" width="104" height="104" rx="14" fill="url(#msk-gold)" />
      <rect
        x="-52"
        y="-52"
        width="104"
        height="104"
        rx="14"
        fill="url(#msk-gold)"
        transform="rotate(45)"
      />
      <circle r="22" fill="#1E3A8A" />
      <circle r="10" fill="url(#msk-gold)" />
    </g>
  </g>
</svg>
