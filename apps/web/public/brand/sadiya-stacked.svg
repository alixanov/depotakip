<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 360 480"
  role="img"
  aria-label="Sadiya Kargo"
>
  <title>Sadiya Kargo</title>
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="ss-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Mark centered horizontally -->
  <g transform="translate(60,0)">
    <rect width="240" height="240" rx="52" fill="url(#ss-bg)" />
    <g transform="translate(0,0) scale(0.469)">
      <path
        d="M 416 160
           C 416 64, 96 64, 96 192
           C 96 256, 416 256, 416 320
           C 416 448, 96 448, 96 352"
        stroke="#FFFFFF"
        stroke-width="48"
        stroke-linecap="round"
        fill="none"
      />
      <g transform="translate(256 256)">
        <rect x="-52" y="-52" width="104" height="104" rx="14" fill="url(#ss-gold)" />
        <rect
          x="-52"
          y="-52"
          width="104"
          height="104"
          rx="14"
          fill="url(#ss-gold)"
          transform="rotate(45)"
        />
        <circle r="22" fill="#1E3A8A" />
        <circle r="10" fill="url(#ss-gold)" />
      </g>
    </g>
  </g>

  <!-- Wordmark beneath the mark -->
  <g
    transform="translate(180,320)"
    text-anchor="middle"
    font-family="'Geist', 'Inter', 'Manrope', 'Helvetica Neue', system-ui, -apple-system, sans-serif"
  >
    <text y="0" font-size="76" font-weight="800" letter-spacing="-2" fill="#0F172A">
      Sadiya
    </text>
    <!-- Decorative hairline with Seljuk-star bullet -->
    <line x1="-90" y1="36" x2="-16" y2="36" stroke="#CBD5E1" stroke-width="2" />
    <g transform="translate(0 36)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="url(#ss-gold)" />
      <rect
        x="-6"
        y="-6"
        width="12"
        height="12"
        rx="2"
        fill="url(#ss-gold)"
        transform="rotate(45)"
      />
    </g>
    <line x1="16" y1="36" x2="90" y2="36" stroke="#CBD5E1" stroke-width="2" />
    <text y="86" font-size="28" font-weight="600" letter-spacing="16" fill="#475569">
      KARGO
    </text>
  </g>
</svg>
