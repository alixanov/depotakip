<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-label="Sadiya"
>
  <title>Sadiya</title>
  <defs>
    <linearGradient id="sadiya-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="sadiya-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="sadiya-shine" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#sadiya-bg)" />

  <!--
    Flowing S — drawn as a single continuous cubic-bezier path.
    The S threads through the center where the Seljuk star sits as its
    pivot / jewel — visually integrating glyph and ornament.
  -->
  <path
    d="M 416 160
       C 416 64, 96 64, 96 192
       C 96 256, 416 256, 416 320
       C 416 448, 96 448, 96 352"
    stroke="#FFFFFF"
    stroke-width="48"
    stroke-linecap="round"
    fill="none"
  />

  <!--
    Selçuklu yıldızı — the eight-pointed Seljuk star, the most recognised
    historic ornament shared across Turkic Central Asia and Anatolia.
    Built from two overlaid squares rotated 45°, with softly rounded points
    so the glyph reads cleanly at favicon sizes.
  -->
  <g transform="translate(256 256)">
    <!-- Soft glow behind the star -->
    <rect
      x="-56"
      y="-56"
      width="112"
      height="112"
      rx="20"
      fill="url(#sadiya-gold)"
      opacity="0.35"
      filter="url(#sadiya-shine)"
    />
    <rect
      x="-56"
      y="-56"
      width="112"
      height="112"
      rx="20"
      fill="url(#sadiya-gold)"
      opacity="0.35"
      filter="url(#sadiya-shine)"
      transform="rotate(45)"
    />

    <!-- Two squares forming the eight-pointed star -->
    <rect x="-52" y="-52" width="104" height="104" rx="14" fill="url(#sadiya-gold)" />
    <rect
      x="-52"
      y="-52"
      width="104"
      height="104"
      rx="14"
      fill="url(#sadiya-gold)"
      transform="rotate(45)"
    />

    <!-- Inner dark medallion adds depth and "anchors" the star -->
    <circle r="22" fill="#1E3A8A" />
    <circle r="10" fill="url(#sadiya-gold)" />
  </g>
</svg>
