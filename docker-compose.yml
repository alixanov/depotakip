name: depotakip

services:
  mongo:
    image: mongo:7.0
    container_name: depotakip-mongo
    command:
      - mongod
      - --replSet=rs0
      - --bind_ip_all
      - --port=27017
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 10s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: depotakip-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: depotakip-minio
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: depotakip-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minio minio12345 &&
        mc mb --ignore-existing local/depotakip-photos &&
        mc anonymous set download local/depotakip-photos &&
        echo "minio bucket ready"
    restart: "no"

volumes:
  mongo-data:
  redis-data:
  minio-data:
